name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  gates:
    name: Validation gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: laft
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: laft
          persist-credentials: false
      # Laft depends on the Stav checkout next to it during development.
      - name: Checkout Stav
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: QaidVoid/stav
          path: stav
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Document
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
      - name: Check for git dependencies
        run: |
          ! grep -q 'source = "git+' Cargo.lock
      - name: Install the musl C compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binaries
        run: cargo build --workspace --release --target x86_64-unknown-linux-musl
      - name: Check that every binary is static
        run: |
          count=0
          for bin in $(find target/x86_64-unknown-linux-musl/release -maxdepth 1 -type f -perm -u+x); do
            count=$((count + 1))
            if readelf -lW "$bin" | grep -q INTERP || readelf -dW "$bin" | grep -q NEEDED; then
              echo "$bin is not a static executable"
              exit 1
            fi
          done
          test "$count" -gt 0
