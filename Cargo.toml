[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
  "crates/laft-core",
  "crates/laft-elf",
  "crates/laft-fetch",
  "crates/laft-index",
  "crates/laft-pkg",
  "crates/laft-resolve",
  "crates/laft-store",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/QaidVoid/laft"
version = "0.1.0"

[workspace.dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
laft-core = { version = "0.1.0", path = "crates/laft-core" }
laft-index = { version = "0.1.0", path = "crates/laft-index" }
laft-pkg = { version = "0.1.0", path = "crates/laft-pkg" }
minisign = { version = "0.10.0", default-features = false }
minisign-verify = { version = "0.3.0", default-features = false }
object = { version = "0.40.0", default-features = false, features = ["elf", "read_core", "std", "unaligned"] }
proptest = "1.12.0"
rustix = { version = "1.1.6", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tempfile = "3.27.0"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
print_stdout = "warn"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
