[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
  "crates/laft-core",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/QaidVoid/laft"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
print_stdout = "warn"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
