[package]
name = "laft-build"
description = "The Laft package builder: recipe evaluation, build planning and source fetching"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
bzip2.workspace = true
flate2.workspace = true
laft-core.workspace = true
laft-fetch.workspace = true
lzma-rust2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
stav.workspace = true
tar.workspace = true
zip.workspace = true
zstd.workspace = true

[dev-dependencies]
insta.workspace = true
laft-test.workspace = true
lzma-rust2 = { workspace = true, features = ["encoder"] }
