[package]
name = "laft-pkg"
description = "Reading and writing Laft package files and payload manifests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
laft-core = { version = "0.1.0", path = "../laft-core" }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
zstd = { version = "0.14.3", default-features = false }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
